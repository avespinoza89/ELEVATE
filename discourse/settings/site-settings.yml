# ELEVATE Commons - Discourse Site Settings Configuration
# Import this file to configure your Discourse instance
# Admin > Settings > Import/Export

---
## Basic Site Information
basic:
  title: "ELEVATE Commons"
  site_description: "A dedicated community for place-based funders focused on learning, evaluation, and transformative philanthropy."
  short_site_description: "Unite. Learn. ELEVATE - Transforming Place-Based Philanthropy"
  site_contact_name: "ELEVATE Commons Team"
  site_contact_username: "elevate_admin"
  contact_email: "hello@unitelearnelevate.com"
  contact_url: "https://www.unitelearnelevate.com"
  company_name: "Unite. Learn. ELEVATE"
  governing_law: "United States"
  city_for_disputes: "Your City, State"

## Branding
branding:
  logo: "/uploads/default/original/1X/elevate-logo.png"
  logo_small: "/uploads/default/original/1X/elevate-logo-small.png"
  favicon: "/uploads/default/original/1X/favicon.ico"
  apple_touch_icon: "/uploads/default/original/1X/apple-touch-icon.png"
  opengraph_image: "/uploads/default/original/1X/elevate-social-share.png"
  twitter_card_image: "/uploads/default/original/1X/elevate-social-share.png"

## Login & Registration
login:
  login_required: false # Set to true for private community
  must_approve_users: false # Set to true for invite-only
  enable_local_logins: true
  enable_local_account_create: true
  enable_sso: false # Configure SSO if needed
  invite_only: false # Set to true for invite-only
  full_name_required: true
  enable_names: true

## User Profiles
users:
  min_username_length: 3
  max_username_length: 20
  min_password_length: 10
  enable_user_directory: true
  hide_user_profiles_from_public: false
  allow_uploaded_avatars: true
  default_avatars: "initials"
  automatically_download_gravatars: true
  allow_profile_backgrounds: true

## Content & Posting
posting:
  min_post_length: 20
  min_first_post_length: 20
  body_min_entropy: 7
  title_min_entropy: 10
  min_topic_title_length: 5
  max_topic_title_length: 255
  allow_duplicate_topic_titles: false
  min_title_similar_length: 10
  educate_until_posts: 2
  allow_uncategorized_topics: false # Force category selection

## Trust Levels
trust_levels:
  tl0_requires_read_posts: 5
  tl0_requires_time_spent_mins: 10
  tl1_requires_read_posts: 30
  tl1_requires_time_spent_mins: 60
  tl1_requires_topics_replied_to: 3
  tl1_requires_topics_viewed: 4
  tl1_requires_topics_viewed_all_time: 15
  tl2_requires_read_posts: 100
  tl2_requires_time_spent_mins: 300 # 5 hours
  tl2_requires_topics_viewed: 20
  tl2_requires_topics_viewed_all_time: 100
  tl2_requires_days_visited: 15
  tl2_requires_likes_received: 1
  tl2_requires_likes_given: 1
  tl3_requires_days_visited: 50
  tl3_requires_topics_viewed: 500
  tl3_requires_topics_viewed_all_time: 2000
  tl3_requires_posts_read: 500
  tl3_requires_posts_read_all_time: 2500
  tl3_requires_topics_replied_to: 10
  tl3_requires_likes_given: 30
  tl3_requires_likes_received: 20
  tl3_time_period: 100 # days

## Email Settings
email:
  notification_email: "noreply@community.unitelearnelevate.com"
  email_in: false
  reply_by_email_enabled: false
  digest_enabled: true
  default_digest_email_frequency: "weekly" # Options: never, daily, weekly, biweekly, monthly
  suppress_digest_email_after_days: 365

## Notifications
notifications:
  enable_mailing_list_mode: true
  default_email_mailing_list_mode: false
  default_email_previous_replies: "unless_emailed"
  default_email_private_messages: true
  default_email_always: false
  disable_mailing_list_mode: false

## Search
search:
  min_search_term_length: 3
  search_tokenize_chinese_japanese_korean: true
  search_recent_regular_posts_size: 100000
  use_pg_headlines_for_excerpt: false

## Categories
categories:
  fixed_category_positions: false
  allow_uncategorized_topics: false
  category_style: "bullet" # Options: bullet, bar, box, none
  max_category_nesting: 2
  suppress_uncategorized_badge: true

## Tags
tags:
  tagging_enabled: true
  tag_style: "simple" # Options: simple, bullet, box
  max_tags_per_topic: 5
  max_tag_length: 30
  min_trust_level_to_tag_topics: 0
  min_trust_to_create_tag: 2
  max_tags_in_filter_list: 30
  show_filter_by_tag: true

## Files & Uploads
files:
  authorized_extensions: "jpg|jpeg|png|gif|heic|heif|webp|svg|ico|pdf|docx|xlsx|pptx|mp4|mov|webm|mp3|wav"
  max_attachment_size_kb: 10240 # 10MB
  max_image_size_kb: 8192 # 8MB
  max_image_width: 4000
  max_image_height: 4000
  create_thumbnails: true
  enable_s3_uploads: false # Configure if using S3

## Security & Spam
security:
  must_approve_users: false
  approve_unless_trust_level: -1
  approve_unless_staged: false
  approve_post_count: 0
  approve_new_topics_unless_trust_level: 0
  unique_ip_address_constraint: false
  use_admin_ip_allowlist: false
  allowed_spam_host_domains: ""
  newuser_spam_host_threshold: 3
  white_listed_spam_host_domains: ""

## Rate Limits
rate_limits:
  max_topics_per_day: 20
  max_topics_in_first_day: 5
  max_replies_per_topic: 10000
  max_likes_per_day: 50
  max_bookmarks_per_day: 200
  max_flags_per_day: 20
  max_edits_per_day: 30
  newuser_max_links: 3
  newuser_max_images: 0 # 0 means no images for new users
  newuser_max_attachments: 0
  newuser_max_mentions_per_post: 2
  newuser_max_replies_per_topic: 3

## Moderation
moderation:
  approve_unless_trust_level: -1
  auto_silence_fast_typers_max_trust_level: 0
  auto_silence_fast_typers_on_first_post: true
  silence_new_user_sensitivity: 0.5
  num_flaggers_to_close_topic: 5
  num_flags_to_close_topic: 12
  hide_post_sensitivity: 0.5
  flag_sockpuppets: true

## Onboarding
onboarding:
  bootstrap_mode_enabled: false
  wizard_enabled: true
  global_notice: ""
  short_progress_text_threshold: 5000
  long_progress_text_threshold: 10000

## Presence
presence:
  presence_enabled: true
  presence_max_users_shown: 10

## Plugins
plugins:
  solved_enabled: true # For Ask the Community category
  assign_enabled: false
  chat_enabled: false # Enable if you want chat feature
  discourse_calendar_enabled: true
  discourse_cakeday_enabled: true
  discourse_voting_enabled: false

## Discourse AI (if applicable)
ai:
  ai_helper_enabled: false
  ai_embeddings_enabled: false
  ai_summarization_enabled: false

## Badges
badges:
  enable_badges: true
  enable_badge_sql: true
  max_favorite_badges: 2

## User API Keys
api:
  allow_user_api_keys: false
  max_user_api_keys: 10

## Social Logins (Configure if needed)
social_logins:
  enable_google_oauth2_logins: false
  enable_facebook_logins: false
  enable_github_logins: false
  enable_twitter_logins: false
  enable_linkedin_oauth2_logins: false

## Privacy
privacy:
  hide_email_address_taken: true
  hide_user_profiles_from_public: false
  allow_anonymous_posting: false
  anonymous_posting_min_trust_level: 1
  allow_restore: true
  delete_user_max_post_age: 60 # days
  delete_all_posts_max: 15

## GDPR
gdpr:
  allow_user_anonymization: true
  allow_users_to_hide_profile: true
  allow_users_to_download_data: true
  allow_users_to_delete_account: true

## Posts
posts:
  post_undo_action_window_mins: 10
  staff_edit_locks_post: false
  editing_grace_period: 300 # seconds
  editing_grace_period_max_diff: 100
  editing_grace_period_max_diff_high_trust: 400
  post_edit_time_limit: 86400 # 24 hours in seconds

## Topics
topics:
  default_topics_automatic_unpin_days: 90
  default_other_auto_track_topics_after_msecs: 60000 # 1 minute
  default_other_notification_level_when_replying: 2 # Tracking
  default_other_new_topic_duration_minutes: 2880 # 2 days
  default_other_auto_track_topics_after_msecs: 240000 # 4 minutes

## Emoji
emoji:
  enable_emoji: true
  enable_emoji_shortcuts: true
  emoji_set: "apple"
  default_emoji_reactions: "heart|+1|tada|thinking"

## Navigation & Sidebar
navigation:
  navigation_menu: "sidebar" # Options: legacy, header_dropdown, sidebar

sidebar:
  enable_sidebar: true
  enable_experimental_sidebar_hamburger: false
  default_navigation_menu_categories: "latest|new|unread|top|categories"
  default_sidebar_show_count_of_new_items: true
  sidebar_list_destination: "all_topics"

## Mobile
mobile:
  enable_mobile_theme: true
  mobile_view: true

## Performance
performance:
  force_https: true
  enable_cors: false
  cors_origins: ""
  cdn_url: "" # Configure if using CDN

## Backup
backup:
  backup_location: "local"
  maximum_backups: 7
  backup_frequency: 7 # days
  backup_time_of_day: "03:00"

## Uncategorized
other:
  allow_profile_backgrounds: true
  enable_user_status: true
  enable_whispers: true # For moderator-only comments
  whispers_allowed_groups: "staff"
  enable_personal_messages: true
  min_trust_to_send_messages: 1
  enable_badges: true
  max_mentions_per_post: 10
  newuser_max_mentions_per_post: 2
  here_mention_enabled: true

## Custom Fields (For ELEVATE-specific data)
custom:
  # Configure custom user fields for:
  # - Organization name
  # - Organization type
  # - Geographic focus
  # - Areas of interest
  # - Role/title

## Email Templates (Reference to custom templates)
email_templates:
  # Welcome email
  # Digest email
  # Notification emails
  # See discourse/settings/email-templates/ for custom templates

---
# Notes:
# 1. Import this file via Admin > Settings > Import/Export
# 2. Review and adjust settings based on your specific needs
# 3. Some settings may require plugins to be installed
# 4. Test all settings in a staging environment first
# 5. Configure email SMTP settings separately in Admin > Email
# 6. Set up backups and monitoring after initial setup
#
# For more information:
# - https://meta.discourse.org/
# - https://docs.discourse.org/
