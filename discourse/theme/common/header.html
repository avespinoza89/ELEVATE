<script type="text/discourse-plugin" version="0.8">
  // ELEVATE Commons Custom Header

  api.decorateWidget('header:before', helper => {
    // Add geometric pattern to header
    if (settings.show_geometric_pattern) {
      return helper.h('div.elevate-header-pattern');
    }
  });

  // Custom welcome message for first-time visitors
  api.onPageChange(() => {
    const currentUser = api.getCurrentUser();
    if (!currentUser && !localStorage.getItem('elevate_welcomed')) {
      // Show welcome modal for guests
      localStorage.setItem('elevate_welcomed', 'true');
    }
  });
</script>
